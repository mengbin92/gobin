name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0, v2.0.0 等

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux AMD64
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          # Linux ARM64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          # macOS AMD64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          # macOS ARM64 (Apple Silicon)
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          # Windows AMD64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          # FreeBSD AMD64
          - goos: freebsd
            goarch: amd64
            suffix: freebsd-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          LDFLAGS="-s -w -X 'github.com/mengbin92/gobin/cmd/gobin/commands.Version=${VERSION}' -X 'github.com/mengbin92/gobin/cmd/gobin/commands.Commit=${COMMIT}' -X 'github.com/mengbin92/gobin/cmd/gobin/commands.BuildDate=${BUILD_DATE}'"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags "${LDFLAGS}" -o dist/gobin-${VERSION}-${{ matrix.suffix }} ./cmd/gobin
          else
            go build -ldflags "${LDFLAGS}" -o dist/gobin-${VERSION}-${{ matrix.suffix }} ./cmd/gobin
            chmod +x dist/gobin-${VERSION}-${{ matrix.suffix }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gobin-${{ matrix.suffix }}
          path: dist/gobin-${{ github.ref_name }}-${{ matrix.suffix }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/mengbin92/gobin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare build metadata
        id: build-vars
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u '+%Y-%m-%d_%H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.build-vars.outputs.commit }}
            BUILD_DATE=${{ steps.build-vars.outputs.build_date }}

  release:
    name: Create Release
    needs:
      - build
      - docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有标签和提交历史

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Package release artifacts
        run: |
          mkdir -p release
          find dist -maxdepth 2 -type f -name 'gobin-*' | sort | while read -r file; do
            name="$(basename "$file")"
            if [[ "$name" == *.exe ]]; then
              archive="${name%.exe}.zip"
              (cd "$(dirname "$file")" && zip -q "${GITHUB_WORKSPACE}/release/${archive}" "$name")
            else
              archive="${name}.tar.gz"
              tar czf "release/${archive}" -C "$(dirname "$file")" "$name"
            fi
            echo "Created release/${archive}"
          done
          (cd release && shasum -a 256 *.tar.gz *.zip > SHA256SUMS)
          ls -lh release/

      - name: Select release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CANDIDATES=(
            "RELEASE-NOTES-v${VERSION}.md"
            "RELEASE-NOTES-${VERSION}.md"
            "RELEASE-NOTES.md"
          )

          for file in "${CANDIDATES[@]}"; do
            if [ -f "$file" ]; then
              echo "path=$file" >> "$GITHUB_OUTPUT"
              echo "Using release notes: $file"
              exit 0
            fi
          done

          echo "No release notes file found for ${TAG}" >&2
          echo "Expected one of:"
          printf '  %s\n' "${CANDIDATES[@]}"
          exit 1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Gobin ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
