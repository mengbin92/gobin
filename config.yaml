# Blog Configuration
title: 孟斯特的个人博客
description: 专注于区块链技术、Go语言开发、Web应用架构
author: 孟斯特
languageCode: zh-CN
baseURL: https://mengbin92.github.io

# Theme configuration
theme: "example"
themesDir: themes

# Directory configuration
contentDir: _posts
staticDir: assets
publishDir: public

# Pagination
paginate: 10
paginatePath: page

# Permalink configuration
permalinks:
  posts: /:year-:month-:day-:title/

# Navigation links
navbarLinks:
  - name: 博客
    url: /
  - name: 分类
    url: /categories/
  - name: 标签
    url: /tags/
  - name: 关于
    url: /about/

# Social media links
social:
  email: mailto:mengbin1992@outlook.com
  github: https://github.com/mengbin92

# Feature flags
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true

# Markdown rendering
markup:
  allowUnsafeHTML: true

# SEO configuration (optional, default is enabled)
seo:
  enabled: true
  openGraph: true
  twitterCard: true
  image: "/images/seo-cover.jpg"

# Comments system configuration (optional, enable if needed)
# comments:
#   enabled: true
#   provider: "utterances"  # Options: disqus, gitalk, utterances
#   utterances:
#     repo: "mengbin92/blog-comments"
#     theme: "github-light"

# Analytics configuration (optional, enable if needed)
# analytics:
#   provider: "google"  # Options: google, baidu, matomo
#   google:
#     trackingID: "G-XXXXXXXXXX"

# Extended parameters
params:
  author: 孟斯特
  dateFormat: "2006-01-02"
